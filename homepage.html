<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" />
    <link rel="icon" type="image" href="media/images/yt_favicon.png">
    <title>MeCylinder</title>
</head>
<body>
    <header>
        <div class="left-nav">
            <span class="hamburger-menu"><i class="fa-solid fa-bars"></i></span>
            <span class="brand-logo">
                <img src="media/images/yt_favicon.png">
                <p>YouTube</p>
            </span>
        </div>

        <div class="search-controls">
            <input type="text" placeholder="Search" class="search-field" name="search-field">
            <button class="search-button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="account-controls">
            <span class="kebab-settings"><i class="fa-solid fa-ellipsis-vertical"></i></span>
            <span class="signup-button">
                <i class="fa-regular fa-circle-user"></i>
                <p>Sign In</p>
            </span>
        </div>
    </header>

    <main>
        <section class="hero-section">

        </section>

        <section class="video-display">

        </section>

        <section class="left-sidebar">

        </section>
    </main>    

    <footer>
        <!-- Fun Fact: YouTube does not have a footer as it features an endless scrolll feed, just like TikTok. -->
        <!-- Just add that into the footer, the project will not feature the same endless feed. -->
    </footer>
</body>
</html>
